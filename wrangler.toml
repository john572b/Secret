"$schema" = "./node_modules/wrangler/config-schema.json"
name = "secret-boi-lu"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Domaine personnalisé (zone boi.lu sur le même compte).
routes = [
  { pattern = "secret.boi.lu", custom_domain = true }
]

[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Limitation de débit par adresse IP (clé = CF-Connecting-IP, jamais journalisée).
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[observability]
enabled = false

# Environnement de test local : mêmes objets, limites de débit relevées.
[env.test]
workers_dev = false
routes = []

[[env.test.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.test.ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10000, period = 60 }

[[env.test.ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "1002"
simple = { limit = 10000, period = 60 }

[[env.test.ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1003"
simple = { limit = 10000, period = 60 }
